name: Neon Inventory TEMP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-inventory-temp.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: little-hat-27601841
    steps:
      - name: Read-only Neon inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "NEON_INVENTORY_ERROR=missing_api_key"
            exit 2
          fi
          node --input-type=module <<'NODE'
          const base='https://console.neon.tech/api/v2';
          const headers={Authorization:'Bearer '+process.env.NEON_API_KEY,Accept:'application/json'};
          async function get(path){
            const res=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});
            const text=await res.text();
            let body=null; try{body=text?JSON.parse(text):null}catch{body={raw:text.slice(0,400)}}
            console.log('HTTP='+res.status+' PATH='+path);
            if(!res.ok){console.log('NEON_ERROR='+JSON.stringify(body)); return null;}
            return body;
          }
          const id=process.env.NEON_PROJECT_ID;
          const p=await get('/projects/'+encodeURIComponent(id));
          if(p) console.log('NEON_PROJECT='+JSON.stringify({id:p.project?.id??p.id??null,name:p.project?.name??p.name??null,org_id:p.project?.org_id??p.org_id??null,region_id:p.project?.region_id??p.region_id??null,pg_version:p.project?.pg_version??p.pg_version??null}));
          const br=await get('/projects/'+encodeURIComponent(id)+'/branches?limit=100');
          if(br) console.log('NEON_BRANCHES='+JSON.stringify((br.branches||[]).map(b=>({id:b.id,name:b.name,parent_id:b.parent_id??null,primary:b.primary??null,protected:b.protected??null,created_at:b.created_at??null,updated_at:b.updated_at??null}))));
          const ep=await get('/projects/'+encodeURIComponent(id)+'/endpoints');
          if(ep) console.log('NEON_ENDPOINTS='+JSON.stringify((ep.endpoints||[]).map(e=>({id:e.id,branch_id:e.branch_id,state:e.current_state,type:e.type,created_at:e.created_at??null,updated_at:e.updated_at??null}))));
          NODE
