name: Audit Source Snapshot
on:
  push:
    branches: [audit/complete-2026-10-13]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        run: |
          git fsck --no-dangling
          git archive --format=tar.gz --output=pulse-source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-audit-source-snapshot
          path: pulse-source-snapshot.tar.gz
          retention-days: 2
