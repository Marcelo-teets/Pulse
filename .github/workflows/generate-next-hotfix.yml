name: Generate Next security lockfile

on:
  push:
    branches:
      - hotfix/next-16.4.0

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Update Next.js to 16.4.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/next-16.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install next@16.4.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Next.js to 16.4.0"
          git push origin HEAD:hotfix/next-16.4.0
