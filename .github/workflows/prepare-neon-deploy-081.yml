name: Prepare Neon Function Deployment 0.8.1

on:
  push:
    branches: [ops/neon-deploy-v0.8.1]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Prepare Neon function payload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/neon-deploy-v0.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-neon-linkedin-function.mjs
      - name: Prepare base64 payload
        run: |
          mkdir -p deploy
          base64 -w0 dist/pulse-linkedin-api-v0.8.1.zip > deploy/neon-function-v0.8.1.b64
      - name: Commit payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/neon-function-v0.8.1.b64
          git commit -m "Prepare Neon function payload v0.8.1"
          git push origin HEAD:ops/neon-deploy-v0.8.1
