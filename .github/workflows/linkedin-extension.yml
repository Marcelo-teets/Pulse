name: LinkedIn Extension CI

on:
  pull_request:
    paths:
      - "extensions/linkedin-capture/**"
      - "scripts/validate-linkedin-extension.mjs"
      - "scripts/test-linkedin-extractor.mjs"
      - ".github/workflows/linkedin-extension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/linkedin-capture/**"
      - "scripts/validate-linkedin-extension.mjs"
      - "scripts/test-linkedin-extractor.mjs"
      - ".github/workflows/linkedin-extension.yml"

concurrency:
  group: linkedin-extension-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/validate-linkedin-extension.mjs
      - run: node --check extensions/linkedin-capture/background.js
      - run: node --check extensions/linkedin-capture/popup.js
      - run: node --check extensions/linkedin-capture/content.js
      - run: node scripts/test-linkedin-extractor.mjs
      - run: node scripts/build-linkedin-extension.mjs
      - run: cd dist && zip -r pulse-linkedin-capture-v0.8.6.zip linkedin-capture
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-linkedin-capture-v0.8.6
          path: dist/pulse-linkedin-capture-v0.8.6.zip
